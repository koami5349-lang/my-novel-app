<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunflower Novels</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --button-color: var(--tg-theme-button-color, #0088cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
      --font-size: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Controls Bar (Font Size & Theme Switcher) */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--secondary-bg);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .font-controls button, .theme-btn {
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 4px;
    }

    .card {
      background-color: var(--secondary-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    .action-btn {
      width: 100%;
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .toc-item {
      padding: 12px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .chapter-view {
      display: none;
    }

    .back-btn {
      background-color: transparent;
      color: var(--button-color);
      border: none;
      padding: 0;
      margin-bottom: 12px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    #viewContent {
      font-size: var(--font-size);
      white-space: pre-line;
      line-height: 1.8;
    }

    /* Dark Mode Theme Classes */
    body.dark-mode {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --secondary-bg: #1e1e1e;
    }
  </style>
</head>
<body>

  <!-- Controls Bar: Font Size & Theme Adjuster -->
  <div class="controls-bar">
    <div class="font-controls">
      <span>စာလုံးဆိုဒ်: </span>
      <button onclick="changeFontSize(-2)">A-</button>
      <button onclick="changeFontSize(2)">A+</button>
    </div>
    <button class="theme-btn" onclick="toggleTheme()">🌙 / ☀️ Mode</button>
  </div>

  <!-- စာရေးသည့် အပိုင်း -->
  <div class="card" id="writerSection">
    <h3 style="margin-top: 0;">✍️ အခန်းသစ် ရေးသားရန်</h3>
    <label>အခန်း ခေါင်းစဉ် (Title):</label>
    <input type="text" id="chapterTitle" placeholder="ဥပမာ - Chapter 1: အစပြုခြင်း">
    
    <label>စာမူ အပြည့်အစုံ (Content):</label>
    <textarea id="chapterContent" placeholder="ဒီနေရာမှာ စာရေးပါ..."></textarea>
    
    <button class="action-btn" onclick="saveChapter()">Publish လုပ်မည်</button>
  </div>

  <!-- မာတိကာ အပိုင်း -->
  <div class="card" id="tocSection">
    <h3 style="margin-top: 0;">📚 မာတိကာ (Chapters)</h3>
    <ul class="toc-list" id="tocList"></ul>
  </div>

  <!-- စာဖတ်သည့် အပိုင်း -->
  <div class="card chapter-view" id="readerSection">
    <button class="back-btn" onclick="showTOC()">← မာတိကာသို့ ပြန်သွားရန်</button>
    <h2 id="viewTitle" style="margin-top: 0;"></h2>
    <hr style="border: 0.5px solid rgba(0,0,0,0.1);">
    <p id="viewContent"></p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentFontSize = 16;

    // Font Size ပြောင်းလဲပေးသည့် Function
    function changeFontSize(delta) {
      currentFontSize = Math.min(Math.max(12, currentFontSize + delta), 28);
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
    }

    // Light/Dark Theme ပြောင်းပေးသည့် Function
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    let chapters = JSON.parse(localStorage.getItem('sunflower_chapters')) || [
      {
        title: "Chapter 1: နိဒါန်း",
        content: "ဒါကတော့ Sunflower Novels ရဲ့ ပထမဆုံး နမူနာ စာမူ ဖြစ်ပါတယ်။ Font Size ခလုတ်များနှင့် Theme ပြောင်းစနစ်ပါဝင်လာပါပြီ။"
      }
    ];

    function renderTOC() {
      const tocList = document.getElementById('tocList');
      tocList.innerHTML = '';

      if(chapters.length === 0) {
        tocList.innerHTML = '<li style="padding:10px; color:#888;">စာမူ မရှိသေးပါ။</li>';
        return;
      }

      chapters.forEach((ch, index) => {
        const li = document.createElement('li');
        li.className = 'toc-item';
        li.innerHTML = `<span>📖 ${ch.title}</span> <span>➔</span>`;
        li.onclick = () => openChapter(index);
        tocList.appendChild(li);
      });
    }

    function saveChapter() {
      const title = document.getElementById('chapterTitle').value.trim();
      const content = document.getElementById('chapterContent').value.trim();

      if (!title || !content) {
        alert('ခေါင်းစဉ်နှင့် စာမူကို ပြည့်စုံစွာ ရိုက်ထည့်ပါ။');
        return;
      }

      chapters.push({ title, content });
      localStorage.setItem('sunflower_chapters', JSON.stringify(chapters));

      document.getElementById('chapterTitle').value = '';
      document.getElementById('chapterContent').value = '';

      renderTOC();
      alert('အခန်းသစ် တင်ပြီးပါပြီ။');
    }

    function openChapter(index) {
      document.getElementById('writerSection').style.display = 'none';
      document.getElementById('tocSection').style.display = 'none';
      document.getElementById('readerSection').style.display = 'block';

      document.getElementById('viewTitle').innerText = chapters[index].title;
      document.getElementById('viewContent').innerText = chapters[index].content;
    }

    function showTOC() {
      document.getElementById('writerSection').style.display = 'block';
      document.getElementById('tocSection').style.display = 'block';
      document.getElementById('readerSection').style.display = 'none';
    }

    renderTOC();
  </script>
</body>
</html>
