<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Novel Reader</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Firebase JS SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #f4f4f9;
      --text-color: #333333;
      --card-bg: #ffffff;
      --border-color: #ddd;
      --primary-color: #0088cc;
    }

    body.dark-mode {
      --bg-color: #181818;
      --text-color: #e0e0e0;
      --card-bg: #242424;
      --border-color: #444444;
      --primary-color: #64b5f6;
    }

    body {
      font-family: 'Padauk', 'Pyidaungsu', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 15px;
    }

    .controls button {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 5px;
    }

    .admin-panel {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .admin-panel input, .admin-panel textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      box-sizing: border-box;
      background: var(--bg-color);
      color: var(--text-color);
    }

    .admin-panel button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }

    .chapter-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .chapter-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .chapter-content {
      line-height: 1.8;
      white-space: pre-line;
    }

    #loading {
      text-align: center;
      font-style: italic;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="controls">
      <button onclick="changeFontSize(-1)">A-</button>
      <button onclick="changeFontSize(1)">A+</button>
      <button onclick="toggleDarkMode()">🌓</button>
    </div>
  </header>

  <div class="admin-panel">
    <h3>စာမူအသစ် တင်ရန်</h3>
    <input type="text" id="chapTitle" placeholder="အခန်းခေါင်းစဉ် (ဥပမာ - အခန်း ၁)">
    <textarea id="chapContent" rows="5" placeholder="စာမူအပြည့်အစုံ ရေးထည့်ပါ..."></textarea>
    <button onclick="publishChapter()">Publish မူဝါဒဖြင့် တင်မည်</button>
  </div>

  <div id="loading">စာမူများ ရယူနေပါသည်...</div>
  <div id="chaptersContainer"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBDR13h_lXr2lIuYYgL89xXy51kYqVU-8Y",
    authDomain: "my-novel-app-944d6.firebaseapp.com",
    databaseURL: "https://my-novel-app-944d6-default-rtdb.firebaseio.com",
    projectId: "my-novel-app-944d6",
    storageBucket: "my-novel-app-944d6.firebasestorage.app",
    messagingSenderId: "1016439236593",
    appId: "1:1016439236593:web:960f9eac3d2a181b0b0650",
    measurementId: "G-SP70JNCDKB"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let currentFontSize = 16;

  database.ref('chapters').on('value', (snapshot) => {
    const container = document.getElementById('chaptersContainer');
    const loading = document.getElementById('loading');
    container.innerHTML = '';
    loading.style.display = 'none';

    const data = snapshot.val();
    if (data) {
      Object.keys(data).reverse().forEach(key => {
        const item = data[key];
        const card = document.createElement('div');
        card.className = 'chapter-card';
        card.innerHTML = `
          <div class="chapter-title">${item.title}</div>
          <div class="chapter-content" style="font-size: ${currentFontSize}px;">${item.content}</div>
        `;
        container.appendChild(card);
      });
    } else {
      container.innerHTML = '<p style="text-align:center;">စာမူ မရှိသေးပါ။</p>';
    }
  });

  function publishChapter() {
    const title = document.getElementById('chapTitle').value.trim();
    const content = document.getElementById('chapContent').value.trim();

    if (!title || !content) {
      alert('ခေါင်းစဉ်နှင့် စာမူ အပြည့်အစုံ ဖြည့်ပေးပါ။');
      return;
    }

    const newChapRef = database.ref('chapters').push();
    newChapRef.set({
      title: title,
      content: content,
      timestamp: Date.now()
    }, (error) => {
      if (error) {
        alert('စာမူတင်ခြင်း မအောင်မြင်ပါ။');
      } else {
        document.getElementById('chapTitle').value = '';
        document.getElementById('chapContent').value = '';
        alert('စာမူအသစ်ကို အောင်မြင်စွာ တင်ပြီးပါပြီ။');
      }
    });
  }

  function changeFontSize(step) {
    currentFontSize += step;
    const contents = document.querySelectorAll('.chapter-content');
    contents.forEach(el => el.style.fontSize = currentFontSize + 'px');
  }

  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
  }
</script>

</body>
</html>
