<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Novel Reader</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Firebase JS SDKs (Updated Links) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-color: #f4f4f9;
      --text-color: #333333;
      --card-bg: #ffffff;
      --border-color: #ddd;
      --primary-color: #0088cc;
    }

    body.dark-mode {
      --bg-color: #181818;
      --text-color: #e0e0e0;
      --card-bg: #242424;
      --border-color: #444444;
      --primary-color: #64b5f6;
    }

    body {
      font-family: 'Padauk', 'Pyidaungsu', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 15px;
    }

    .controls button, .back-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .back-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      display: none;
    }

    .admin-panel {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .admin-panel input, .admin-panel textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      box-sizing: border-box;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: inherit;
    }

    .admin-panel button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 15px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      font-weight: bold;
    }

    .admin-panel button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Table of Contents List */
    .toc-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    .chapter-item {
      background: var(--card-bg);
      padding: 12px 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chapter-item:active {
      transform: scale(0.98);
    }

    .chapter-item-title {
      font-weight: bold;
      font-size: 1rem;
    }

    .arrow {
      color: #888;
      font-size: 0.9rem;
    }

    /* Reader View */
    #readerView {
      display: none;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .reader-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .reader-content {
      line-height: 1.8;
      white-space: pre-line;
    }

    #loading {
      text-align: center;
      font-style: italic;
      margin-top: 20px;
      color: #777;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <button id="backBtn" class="back-btn" onclick="showToc()">← အခန်းများ</button>
    <div class="controls">
      <button onclick="changeFontSize(-1)">A-</button>
      <button onclick="changeFontSize(1)">A+</button>
      <button onclick="toggleDarkMode()">🌓</button>
    </div>
  </header>

  <div class="admin-panel" id="adminPanel">
    <h3>စာမူအသစ် တင်ရန်</h3>
    <input type="text" id="chapTitle" placeholder="အခန်းခေါင်းစဉ် (ဥပမာ - အခန်း ၁)">
    <textarea id="chapContent" rows="5" placeholder="စာမူအပြည့်အစုံ ရေးထည့်ပါ..."></textarea>
    <button id="pubBtn" onclick="publishChapter()">Publish မူဝါဒဖြင့် တင်မည်</button>
  </div>

  <div id="loading">စာမူများ ရယူနေပါသည်...</div>

  <div id="tocView">
    <div class="toc-title">📖 အခန်းများ စာရင်း</div>
    <div id="tocContainer"></div>
  </div>

  <div id="readerView">
    <div id="readerTitle" class="reader-title"></div>
    <div id="readerContent" class="reader-content"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBDR13h_lXr2lIuYYgL89xXy51kYqVU-8Y",
    authDomain: "my-novel-app-944d6.firebaseapp.com",
    databaseURL: "https://my-novel-app-944d6-default-rtdb.firebaseio.com",
    projectId: "my-novel-app-944d6",
    storageBucket: "my-novel-app-944d6.firebasestorage.app",
    messagingSenderId: "1016439236593",
    appId: "1:1016439236593:web:960f9eac3d2a181b0b0650",
    measurementId: "G-SP70JNCDKB"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let chaptersData = {};
  let currentFontSize = 16;

  database.ref('chapters').on('value', (snapshot) => {
    const tocContainer = document.getElementById('tocContainer');
    const loading = document.getElementById('loading');
    tocContainer.innerHTML = '';
    loading.style.display = 'none';

    chaptersData = snapshot.val() || {};

    if (Object.keys(chaptersData).length > 0) {
      Object.keys(chaptersData).forEach(key => {
        const item = chaptersData[key];
        const itemDiv = document.createElement('div');
        itemDiv.className = 'chapter-item';
        itemDiv.onclick = () => openChapter(key);
        itemDiv.innerHTML = `
          <span class="chapter-item-title">${item.title}</span>
          <span class="arrow">ဖတ်ရန် ➔</span>
        `;
        tocContainer.appendChild(itemDiv);
      });
    } else {
      tocContainer.innerHTML = '<p style="text-align:center; color: #888;">စာမူ မရှိသေးပါ။</p>';
    }
  }, (error) => {
    document.getElementById('loading').innerText = 'Database အမှားအယွင်း ရှိနေပါသည်။';
  });

  function publishChapter() {
    const titleInput = document.getElementById('chapTitle');
    const contentInput = document.getElementById('chapContent');
    const btn = document.getElementById('pubBtn');

    const title = titleInput.value.trim();
    const content = contentInput.value.trim();

    if (!title || !content) {
      alert('ခေါင်းစဉ်နှင့် စာမူ အပြည့်အစုံ ဖြည့်ပေးပါ။');
      return;
    }

    btn.disabled = true;
    btn.innerText = "တင်နေပါသည်...";

    database.ref('chapters').push({
      title: title,
      content: content,
      timestamp: Date.now()
    }).then(() => {
      btn.disabled = false;
      btn.innerText = "Publish မူဝါဒဖြင့် တင်မည်";
      titleInput.value = '';
      contentInput.value = '';
      alert('စာမူအသစ်ကို အောင်မြင်စွာ တင်ပြီးပါပြီ။');
    }).catch((error) => {
      btn.disabled = false;
      btn.innerText = "Publish မူဝါဒဖြင့် တင်မည်";
      alert('စာမူတင်ခြင်း မအောင်မြင်ပါ: ' + error.message);
    });
  }

  function openChapter(key) {
    const item = chaptersData[key];
    if (!item) return;

    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('tocView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    document.getElementById('backBtn').style.display = 'inline-block';

    document.getElementById('readerTitle').innerText = item.title;
    const contentEl = document.getElementById('readerContent');
    contentEl.innerText = item.content;
    contentEl.style.fontSize = currentFontSize + 'px';

    window.scrollTo(0, 0);
  }

  function showToc() {
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('tocView').style.display = 'block';
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('backBtn').style.display = 'none';
  }

  function changeFontSize(step) {
    currentFontSize += step;
    const contentEl = document.getElementById('readerContent');
    if (contentEl) contentEl.style.fontSize = currentFontSize + 'px';
  }

  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
  }
</script>

</body>
</html>
