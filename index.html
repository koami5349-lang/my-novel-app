<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Sunflower Novels</title>

  <!-- Google Web Fonts for Standard Unicode Myanmar -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-color: #12131C;
      --card-bg: #1D1E2C;
      --text-color: #E6E8EE;
      --sub-text: #9499B1;
      --accent-peach: #FFB088;
      --accent-hover: #FFA070;
      --border-color: #2D2F45;
      --input-bg: #161724;
      --danger-color: #FF6B6B;
    }

    body.light-mode {
      --bg-color: #F5F6FA;
      --card-bg: #FFFFFF;
      --text-color: #1D1E2C;
      --sub-text: #6B708D;
      --accent-peach: #FF9463;
      --accent-hover: #E87E4D;
      --border-color: #E2E4ED;
      --input-bg: #EDEEF5;
      --danger-color: #E63946;
    }

    body {
      font-family: 'Noto Sans Myanmar', 'Pyidaungsu', 'Padauk', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      transition: background-color 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .controls button, .back-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      transition: all 0.2s;
    }

    .back-btn {
      background: var(--accent-peach);
      color: #12131C;
      border: none;
      display: none;
    }

    .admin-panel {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
      display: none;
    }

    .admin-panel h3 {
      margin-top: 0;
      color: var(--accent-peach);
      font-size: 1.1rem;
    }

    .admin-panel select, .admin-panel input, .admin-panel textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-sizing: border-box;
      background: var(--input-bg);
      color: var(--text-color);
      font-family: inherit;
      font-size: 0.95rem;
    }

    .admin-panel button {
      background: var(--accent-peach);
      color: #12131C;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      font-weight: bold;
      font-family: inherit;
      transition: background 0.2s;
    }

    .admin-panel button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 14px;
      color: var(--accent-peach);
    }

    .novel-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .novel-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.1s, border-color 0.2s;
    }

    .novel-card:hover {
      border-color: var(--accent-peach);
    }

    .novel-card:active {
      transform: scale(0.98);
    }

    .novel-info {
      display: flex;
      flex-direction: column;
    }

    .novel-title {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .novel-tag {
      font-size: 0.85rem;
      color: var(--sub-text);
      margin-top: 4px;
    }

    .chapter-item {
      background: var(--card-bg);
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .chapter-info {
      cursor: pointer;
      flex-grow: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chapter-info:active {
      transform: scale(0.98);
    }

    .chapter-title-text {
      flex-grow: 1;
      padding-right: 10px;
      word-break: break-word;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .delete-btn {
      background: rgba(255, 107, 107, 0.15);
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: bold;
      display: none;
      transition: background 0.2s;
    }

    .delete-btn:hover {
      background: var(--danger-color);
      color: #FFF;
    }

    .arrow {
      color: var(--accent-peach);
      font-weight: bold;
      white-space: nowrap;
    }

    #readerView {
      display: none;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
    }

    .reader-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-peach);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .reader-content {
      line-height: 2;
      white-space: pre-line;
      letter-spacing: 0.2px;
    }

    #loading {
      text-align: center;
      font-style: italic;
      margin-top: 20px;
      color: var(--sub-text);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <button id="backBtn" class="back-btn" onclick="goBack()">← ပြန်ထွက်မည်</button>
    <div class="controls">
      <button onclick="changeFontSize(-1)">A-</button>
      <button onclick="changeFontSize(1)">A+</button>
      <button onclick="toggleDarkMode()">🌓</button>
    </div>
  </header>

  <!-- Admin Panel -->
  <div class="admin-panel" id="adminPanel">
    <h3>✍️ စာမူအသစ် တင်ရန်</h3>
    <select id="novelSelect">
      <option value="novel1">ချူဆန်းရဲ့ကလေးများနေ့</option>
      <option value="novel2">ဝတ္ထုအမှတ် (၂)</option>
      <option value="novel3">ဝတ္ထုအမှတ် (၃)</option>
    </select>
    <input type="text" id="chapTitle" placeholder="အခန်းခေါင်းစဉ် (ဥပမာ - အခန်း ၁)">
    <textarea id="chapContent" rows="5" placeholder="စာမူအပြည့်အစုံ ရေးထည့်ပါ..."></textarea>
    <button id="pubBtn" onclick="publishChapter()">Publish</button>
  </div>

  <div id="loading">စာမူများ ရယူနေပါသည်...</div>

  <!-- 1. Bookshelf View -->
  <div id="bookshelfView">
    <div class="section-title">📚 ဝတ္ထုများ စာရင်း</div>
    <div class="novel-grid">
      <div class="novel-card" onclick="openNovel('novel1', 'ချူဆန်းရဲ့ကလေးများနေ့')">
        <div class="novel-info">
          <span class="novel-title">ချူဆန်းရဲ့ကလေးများနေ့</span>
          <span class="novel-tag">ဝတ္ထုဖတ်ရန် နှိပ်ပါ</span>
        </div>
        <span class="arrow">➔</span>
      </div>
      <div class="novel-card" onclick="openNovel('novel2', 'ဝတ္ထုအမှတ် (၂)')">
        <div class="novel-info">
          <span class="novel-title">ဝတ္ထုအမှတ် (၂)</span>
          <span class="novel-tag">ဝတ္ထုဖတ်ရန် နှိပ်ပါ</span>
        </div>
        <span class="arrow">➔</span>
      </div>
      <div class="novel-card" onclick="openNovel('novel3', 'ဝတ္ထုအမှတ် (၃)')">
        <div class="novel-info">
          <span class="novel-title">ဝတ္ထုအမှတ် (၃)</span>
          <span class="novel-tag">ဝတ္ထုဖတ်ရန် နှိပ်ပါ</span>
        </div>
        <span class="arrow">➔</span>
      </div>
    </div>
  </div>

  <!-- 2. Chapter List View -->
  <div id="tocView" style="display: none;">
    <div class="section-title" id="selectedNovelTitle">📖 အခန်းများ စာရင်း</div>
    <div id="tocContainer"></div>
  </div>

  <!-- 3. Reader View -->
  <div id="readerView">
    <div id="readerTitle" class="reader-title"></div>
    <div id="readerContent" class="reader-content"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBDR13h_lXr2lIuYYgL89xXy51kYqVU-8Y",
    authDomain: "my-novel-app-944d6.firebaseapp.com",
    databaseURL: "https://my-novel-app-944d6-default-rtdb.firebaseio.com",
    projectId: "my-novel-app-944d6",
    storageBucket: "my-novel-app-944d6.firebasestorage.app",
    messagingSenderId: "1016439236593",
    appId: "1:1016439236593:web:960f9eac3d2a181b0b0650",
    measurementId: "G-SP70JNCDKB"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  let allNovelsData = {};
  let currentNovelId = "";
  let currentFontSize = 16;
  let viewStack = ["bookshelf"];
  let isAdmin = true; // Admin အဖြစ် သတ်မှတ်ထားသည်

  const tg = window.Telegram.WebApp;
  tg.expand();

  if (isAdmin) {
    document.getElementById('adminPanel').style.display = 'block';
  }

  const novelsRef = ref(database, 'novels');
  onValue(novelsRef, (snapshot) => {
    document.getElementById('loading').style.display = 'none';
    allNovelsData = snapshot.val() || {};
    if (currentNovelId) renderChapters(currentNovelId);
  }, (error) => {
    document.getElementById('loading').style.display = 'none';
    console.error("Database Read Error:", error);
  });

  window.publishChapter = async function() {
    const novelId = document.getElementById('novelSelect').value;
    const titleInput = document.getElementById('chapTitle');
    const contentInput = document.getElementById('chapContent');
    const btn = document.getElementById('pubBtn');

    const title = titleInput.value.trim();
    const content = contentInput.value.trim();

    if (!title || !content) {
      alert('ခေါင်းစဉ်နှင့် စာမူ အပြည့်အစုံ ဖြည့်ပေးပါ။');
      return;
    }

    btn.disabled = true;
    btn.innerText = "တင်နေပါသည်...";

    try {
      const chapterListRef = ref(database, `novels/${novelId}/chapters`);
      await push(chapterListRef, {
        title: title,
        content: content,
        timestamp: Date.now()
      });

      btn.disabled = false;
      btn.innerText = "Publish";
      titleInput.value = '';
      contentInput.value = '';
      alert('စာမူအသစ်ကို အောင်မြင်စွာ တင်ပြီးပါပြီ။');
    } catch (error) {
      btn.disabled = false;
      btn.innerText = "Publish";
      alert('စာမူတင်ခြင်း မအောင်မြင်ပါ: ' + error.message);
    }
  };

  window.deleteChapter = async function(novelId, chapterKey, event) {
    event.stopPropagation();
    if (confirm("ဒီအခန်းကို ဖျက်မှာ သေချာပါသလား?")) {
      try {
        const chapterRef = ref(database, `novels/${novelId}/chapters/${chapterKey}`);
        await remove(chapterRef);
        alert("အခန်းကို အောင်မြင်စွာ ဖျက်ပြီးပါပြီ။");
      } catch (error) {
        alert("ဖျက်ခြင်း မအောင်မြင်ပါ: " + error.message);
      }
    }
  };

  window.openNovel = function(novelId, title) {
    currentNovelId = novelId;
    document.getElementById('selectedNovelTitle').innerText = "📖 " + title;
    document.getElementById('bookshelfView').style.display = 'none';
    if (isAdmin) {
      document.getElementById('adminPanel').style.display = 'none';
    }
    document.getElementById('tocView').style.display = 'block';
    document.getElementById('backBtn').style.display = 'inline-block';

    viewStack.push("toc");
    renderChapters(novelId);
  };

  function renderChapters(novelId) {
    const container = document.getElementById('tocContainer');
    container.innerHTML = '';
    const chapters = allNovelsData[novelId]?.chapters || {};

    if (Object.keys(chapters).length > 0) {
      Object.keys(chapters).forEach(key => {
        const item = chapters[key];
        const div = document.createElement('div');
        div.className = 'chapter-item';
        
        div.innerHTML = `
          <div class="chapter-info" id="chap-info-${key}">
            <span class="chapter-title-text">${item.title}</span>
            <span class="arrow">ဖတ်ရန် ➔</span>
          </div>
          <div class="action-group">
            <button class="delete-btn" id="del-${key}" onclick="deleteChapter('${novelId}', '${key}', event)">ဖျက်</button>
          </div>
        `;
        container.appendChild(div);

        // Event Listener ကို သီးသန့်ချိတ်ဆက်ပေးခြင်းဖြင့် Error လုံးဝမဖြစ်စေပါ
        document.getElementById(`chap-info-${key}`).onclick = function() {
          openChapter(item.title, item.content);
        };

        if (isAdmin) {
          document.getElementById(`del-${key}`).style.display = 'inline-block';
        }
      });
    } else {
      container.innerHTML = '<p style="text-align:center; color: var(--sub-text);">စာမူ မရှိသေးပါ။</p>';
    }
  }

  function openChapter(title, content) {
    document.getElementById('tocView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    document.getElementById('readerTitle').innerText = title;
    
    const contentEl = document.getElementById('readerContent');
    contentEl.innerText = content;
    contentEl.style.fontSize = currentFontSize + 'px';

    viewStack.push("reader");
    window.scrollTo(0, 0);
  }

  window.goBack = function() {
    const lastView = viewStack.pop();
    if (lastView === "reader") {
      document.getElementById('readerView').style.display = 'none';
      document.getElementById('tocView').style.display = 'block';
    } else if (lastView === "toc") {
      document.getElementById('tocView').style.display = 'none';
      document.getElementById('bookshelfView').style.display = 'block';
      if (isAdmin) {
        document.getElementById('adminPanel').style.display = 'block';
      }
      document.getElementById('backBtn').style.display = 'none';
      currentNovelId = "";
    }
  };

  window.changeFontSize = function(step) {
    currentFontSize += step;
    const contentEl = document.getElementById('readerContent');
    if (contentEl) contentEl.style.fontSize = currentFontSize + 'px';
  };

  window.toggleDarkMode = function() {
    document.body.classList.toggle('light-mode');
  };
</script>

</body>
</html>
